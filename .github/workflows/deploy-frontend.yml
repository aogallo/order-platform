name: Frontend Deploy
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      env:
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm install
      - run: npm run build
      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://my-${{ inputs.app }}-${{ inputs.env }}
      - name: Invalidate CDN
        run: |
          aws cloudfront create-invalidation \
            --distribution-id XYZ \
            --paths "/*"
