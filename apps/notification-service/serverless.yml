service: notification-service
frameworkVersion: "4"
provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  environment:
    ORDER_NOTIFICATIONS_QUEUE_URL: https://sqs.${aws:region}.amazonaws.com/${aws:accountId}/order-notifications
    SES_FROM_ADDRESS: ${env:SES_FROM_ADDRESS, 'noreply@example.com'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: sqs:ReceiveMessage
          Resource: arn:aws:sqs:${aws:region}:${aws:accountId}:order-notifications
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'
functions:
  processOrderNotification:
    handler: ./src/handlers/processOrderNotification.handler
    events:
      - sqs:
          arn: arn:aws:sqs:${aws.region}:${aws:accountId}:order-notifications
          batchSize: 1
