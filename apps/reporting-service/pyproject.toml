[project]
name = "reporting-service"
version = "0.1.0"
description = "Event-driven order reporting Lambda"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.7",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "moto[dynamodb,s3,sqs]>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3-stubs[dynamodb,s3,sqs]>=1.34",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
