service: tracking-service
frameworkVersion: '4'
plugins:
  - serverless-localstack
provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  environment:
    TRACKING_TABLE: order-platform-tracking-${sls:stage}
    ORDER_EVENTS_QUEUE_URL: https://sqs.${aws:region}.amazonaws.com/${aws:accountId}/order-platform-order-events-${sls:stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:PutItem
          Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/order-platform-tracking-${sls:stage}
        - Effect: Allow
          Action: sqs:ReceiveMessage
          Resource: arn:aws:sqs:${aws:region}:${aws:accountId}:order-platform-order-events-${sls:stage}
custom:
  localstack:
    stages:
      - local
    endpointFile: ${env:LOCALSTACK_ENDPOINT_FILE, './localstack-endpoints.json'}
    host: ${env:LOCALSTACK_HOST, 'http://localhost'}
    lambda:
      mountCode: false
      debug: true
functions:
  getTracking:
    handler: ./src/handlers/getTracking.handler
  processOrderEvent:
    handler: ./src/handlers/processOrderEvent.handler
    events:
      - sqs:
          arn: arn:aws:sqs:${aws:region}:${aws:accountId}:order-platform-order-events-${sls:stage}
          batchSize: 1
